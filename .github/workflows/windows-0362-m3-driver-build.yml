name: EightMax 0.36.2 Milestone 3 - build the input driver ON WINDOWS (EightMaxInput.exe)
# Milestone 3 changes one C# source, desktop/input/Driver.cs: after an operation of the driver's own that stopped part-way (window closed
# or moved, cancelled), the remembered cursor position now follows the driver's own last point, so the next operation is no longer
# reported as "the cursor was moved by someone else" (found by the Milestone 3 Windows CI run 45203097931, two-table stability run).
# This job compiles the executables ON WINDOWS with the .NET Framework 4.x compiler through the shipped windows\Build-Executables.ps1
# (-SkipWgc: the WGC helper's sources did not change), from the Milestone 2 package with the committed m3-overlay/ applied, and publishes
# EightMaxInput.exe, the build script's own evidence record, its log and a summary to branch m3-results/<run id>. Only EightMaxInput.exe
# is taken into the Milestone 3 package: the sources of the other executables did not change, so their Windows-built Milestone 1 binaries
# stay (their outputs from this job are discarded).
on:
  workflow_dispatch:
  push:
    branches: [milestone-3-0362]
    paths: ['.github/workflows/windows-0362-m3-driver-build.yml', 'driver-build-request.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      M2_ZIP: EightMax-Test-Workbench-0.36.2-Milestone-2.zip
      M2_SHA256: 4518a133090be292d3e6d190e6259173d25807323e2156d95f10fcc523febc32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the Milestone 3 sources (Milestone 2 ZIP + m3-overlay) and verify them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/driver-build" work
          git fetch --depth=1 origin milestone-2-0362
          git show "origin/milestone-2-0362:$M2_ZIP" > m2.zip
          have=$(sha256sum m2.zip | cut -d' ' -f1); echo "m2 zip sha256 $have (expected $M2_SHA256)" | tee "$RUNNER_TEMP/driver-build/package.log"; [ "$have" = "$M2_SHA256" ]
          python -I -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); b=z.testzip(); assert b is None, b; z.extractall(sys.argv[2]); print('m2 entries', len(z.namelist()))" m2.zip work | tee -a "$RUNNER_TEMP/driver-build/package.log"
          cp -a m3-overlay/EightMax-Test-Workbench/. work/EightMax-Test-Workbench/
          if [ -f m3-overlay/DELETED.txt ]; then while IFS= read -r f; do [ -n "$f" ] && rm -f "work/EightMax-Test-Workbench/$f"; done < m3-overlay/DELETED.txt; fi
          rm -f m2.zip; cd work/EightMax-Test-Workbench
          python -I -c "import hashlib,pathlib,sys; r=pathlib.Path('.'); L=[l.split('  ',1) for l in pathlib.Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines() if l.strip()]; bad=[f for h,f in L if hashlib.sha256((r/f).read_bytes()).hexdigest()!=h]; print('manifest entries', len(L), 'mismatches', len(bad), bad[:5]); sys.exit(1 if bad else 0)" | tee -a "$RUNNER_TEMP/driver-build/package.log"
          sha256sum desktop/input/*.cs | tee -a "$RUNNER_TEMP/driver-build/package.log"
          echo "W=$(cygpath -w "$PWD")" >> "$GITHUB_ENV"
      - name: Build with windows\Build-Executables.ps1 (-SkipWgc) and record EightMaxInput.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'; $out = Join-Path $env:RUNNER_TEMP 'driver-build'; $bin = Join-Path $out 'bin'; [IO.Directory]::CreateDirectory($bin) | Out-Null
          Set-Location $env:W; $log = Join-Path $out 'build.log'
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Build-Executables.ps1 -Root "' + $env:W + '" -OutDir "' + $bin + '" -SkipWgc') -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError (Join-Path $out 'build.err.log')
          $null = $p.Handle; $p.WaitForExit(); Get-Content $log; Get-Content (Join-Path $out 'build.err.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw ('Build-Executables.ps1 exit ' + $p.ExitCode) }
          Copy-Item (Join-Path $env:W 'evidence\build-evidence.json') (Join-Path $out 'build-evidence-ci.json')
          $exe = Join-Path $bin 'EightMaxInput.exe'; $ver = (& $exe --version 2>&1 | Out-String).Trim(); $fv = (Get-Item $exe).VersionInfo
          $os = Get-CimInstance Win32_OperatingSystem; $sha = { param($f) (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant() }
          $src = [ordered]@{}; foreach ($f in @(Get-ChildItem (Join-Path $env:W 'desktop\input') -Filter *.cs | Sort-Object Name)) { $src['desktop/input/' + $f.Name] = & $sha $f.FullName }
          $rec = [ordered]@{ format = 'eightmax-m3-driver-build'; version = 1; output = 'desktop/bin/EightMaxInput.exe'; sha256 = (& $sha $exe); bytes = (Get-Item $exe).Length; versionOutput = $ver; fileVersion = $fv.FileVersion; productVersion = $fv.ProductVersion
            builtAt = [DateTime]::UtcNow.ToString('o'); buildHost = 'Windows: ' + $os.Caption + ' ' + $os.Version + ' build ' + $os.BuildNumber; script = 'windows\Build-Executables.ps1 -SkipWgc'
            ci = [ordered]@{ runId = $env:GITHUB_RUN_ID; runner = $env:RUNNER_NAME; repository = $env:GITHUB_REPOSITORY; sha = $env:GITHUB_SHA }; sourceHashes = $src
            shippedFromThisBuild = @('desktop/bin/EightMaxInput.exe'); discarded = @('EightMaxWorkbench.exe', 'EightMaxCapture.exe', 'EightMaxTestTable.exe') }
          $json = ConvertTo-Json -InputObject $rec -Depth 5; [IO.File]::WriteAllText((Join-Path $out 'driver-build.json'), $json, (New-Object Text.UTF8Encoding($false))); $json
          if ($ver -notmatch 'EightMaxInput 0\.36\.2-dev') { throw ('unexpected --version output: ' + $ver) }
      - name: Push the build to branch m3-results/<run id>
        if: always()
        shell: bash
        run: |
          set -u
          src="$RUNNER_TEMP/driver-build"; dest="$RUNNER_TEMP/m3-results-branch"; mkdir -p "$dest/driver-build"
          [ -d "$src" ] && cp -r "$src/." "$dest/driver-build/"
          printf '{"run":"%s","sha":"%s","ref":"%s","kind":"driver-build"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" > "$dest/run.json"
          cd "$dest" && git init -q && git checkout -q -b "m3-results/$GITHUB_RUN_ID" && git add -A && git -c user.name="eightmax-ci" -c user.email="eightmax-ci@users.noreply.github.com" commit -q -m "Milestone 3 input driver build, run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/m3-results/$GITHUB_RUN_ID" && echo "build pushed to m3-results/$GITHUB_RUN_ID"
