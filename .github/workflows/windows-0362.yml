name: Windows 0.36.2 build and validation
on:
  push:
    branches: [main, development-0362]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore uploaded source bundle
        shell: pwsh
        run: |
          python -c "import pathlib,base64,zipfile,io; p=pathlib.Path('build-input'); data=base64.b64decode(''.join(f.read_text() for f in sorted(p.glob('*.b64')))); zipfile.ZipFile(io.BytesIO(data)).extractall('.')"
          Copy-Item -Path overrides/* -Destination . -Recurse -Force
          Remove-Item -Recurse -Force overrides
          Copy-Item (Get-Command node).Source runtime/node/node.exe -Force
      - name: Compile current Windows sources
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'windows/Test-0362.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          ./windows/Build-Executables.ps1
      - name: Install browser test dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/em-browser" | Out-Null
          Set-Location "$env:RUNNER_TEMP/em-browser"
          npm install playwright
          npx playwright install chromium
          "NODE_PATH=$env:RUNNER_TEMP/em-browser/node_modules" >> $env:GITHUB_ENV
          $chrome = node -e "console.log(require('playwright').chromium.executablePath())"
          "CHROME_PATH=$chrome" >> $env:GITHUB_ENV
      - name: Generate dashboard and integrity metadata
        shell: pwsh
        run: |
          python tools/build.py
          python tools/make-components.py
          python tools/release-manifest-0362.py
      - name: Verify preserved engine and run regression
        shell: pwsh
        run: |
          $id = & ./native/mwcli.exe --build-id
          if ($LASTEXITCODE -ne 0 -or $id -ne 'EightMaxBuild=7d08acc7eb4577ee') { throw 'Engine identity failed' }
          $env:EIGHTMAX_TEST_CLI = (Resolve-Path native/mwcli.exe).Path
          node --test tests/*.test.cjs *> "$env:RUNNER_TEMP/regression-0362.log"
          if ($LASTEXITCODE -ne 0) { throw 'Regression failed' }
      - name: Execute Windows input acceptance
        timeout-minutes: 5
        if: success() || failure()
        shell: pwsh
        run: |
          & ./desktop/bin/EightMaxInput.exe --selftest --out "$env:RUNNER_TEMP/input-selftest.json"
          node tools/input-acceptance-035.cjs --out "$env:RUNNER_TEMP/input-acceptance.json" --oracle-dir "$env:RUNNER_TEMP/input-oracle"
          if ($LASTEXITCODE -ne 0) { throw 'Input acceptance failed' }
      - name: Execute extended one-table gameplay
        if: success() || failure()
        timeout-minutes: 8
        shell: pwsh
        run: |
          node tools/simulator-benchmark-035.cjs --tables 1 --seconds 300 --width 640 --workloads full-hands:0 --out "$env:RUNNER_TEMP/full-hands.json" --work "$env:RUNNER_TEMP/full-hands-work"
          if ($LASTEXITCODE -ne 0) { throw 'Gameplay execution failed' }
      - name: Execute real screen and input benchmark
        timeout-minutes: 20
        if: success() || failure()
        shell: pwsh
        run: |
          node tools/simulator-benchmark-035.cjs --tables 1,2,5,8,10 --seconds 60 --width 640 --out "$env:RUNNER_TEMP/benchmark.json" --work "$env:RUNNER_TEMP/benchmark-work"
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark execution failed' }
      - name: Package actual build and evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/0.36.2/windows | Out-Null
          foreach ($f in 'regression-0362.log','input-selftest.json','input-acceptance.json','benchmark.json','full-hands.json') {
            if (Test-Path "$env:RUNNER_TEMP/$f") { Copy-Item "$env:RUNNER_TEMP/$f" evidence/0.36.2/windows/ }
          }
          Remove-Item -Recurse -Force build-input
          python tools/release-manifest-0362.py
          python tools/package-0362.py "$env:RUNNER_TEMP/EightMax-0.36.2-Windows-Candidate.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-0362-build-and-evidence
          path: |
            ${{ runner.temp }}/EightMax-0.36.2-Windows-Candidate.zip
            ${{ runner.temp }}/regression-0362.log
            ${{ runner.temp }}/input-selftest.json
            ${{ runner.temp }}/input-acceptance.json
            ${{ runner.temp }}/input-oracle
            ${{ runner.temp }}/full-hands.json
            ${{ runner.temp }}/full-hands-work
            ${{ runner.temp }}/benchmark.json
            ${{ runner.temp }}/benchmark-work
