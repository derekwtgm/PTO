name: EightMax 0.36.2 Milestone 3 - Windows gameplay, fallback compile and lifecycle verification (real windows)
# Runs the Milestone 3 Windows tests of the COMPLETE package on a real Windows desktop (GitHub-hosted windows-latest): PowerShell parse
# check of every script, release checksums, executable identities, the regression suite with the bundled Node.js, desktop-host start
# (prebuilt, forced fallback compile, cache reuse, invalid-cache recovery, shutdown, port release), the Milestone 2 lifecycle acceptance
# under the process-exit audit, the Milestone 3 gameplay acceptance (eliminations, tournament end, untracked-hand recovery, think-time
# holds, multi-table closure, emergency stop) and multi-table stability (1, 2, 5, 8 tables) - exactly windows\Test-Milestone3-0362.ps1,
# which RUN-0362-MILESTONE3-TESTS.cmd runs on the target PC.
# Package: EightMax-Test-Workbench-0.36.2-Milestone-3.zip when it is committed next to this workflow; otherwise (development runs) the
# Milestone 2 ZIP from branch milestone-2-0362 (SHA-256 checked) with the committed m3-overlay/ applied, then verified against the
# overlay's SHA256SUMS.txt. Results are published three ways: the job log (summary + key JSON), the artifact, and a results branch
# m3-results/<run id> (so they can be read with git when the artifact store is not reachable).
on:
  workflow_dispatch:
    inputs:
      stability_seconds: { description: 'seconds per stability part (1, 2, 5, 8 tables)', required: false, default: '60' }
      campaign_hands: { description: 'long campaign: hands to complete (0 = skip)', required: false, default: '0' }
  push:
    branches: [milestone-3-0362]
    paths: ['.github/workflows/windows-0362-m3.yml', 'EightMax-Test-Workbench-0.36.2-Milestone-3.zip', 'm3-overlay/**', 'ci-request.json']
permissions:
  contents: write
jobs:
  m3-windows:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      M3_ZIP: EightMax-Test-Workbench-0.36.2-Milestone-3.zip
      M2_ZIP: EightMax-Test-Workbench-0.36.2-Milestone-2.zip
      M2_SHA256: 4518a133090be292d3e6d190e6259173d25807323e2156d95f10fcc523febc32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify the Milestone 3 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs" work
          if [ -f "$M3_ZIP" ]; then
            echo "mode: committed Milestone 3 ZIP" | tee "$RUNNER_TEMP/logs/package.log"
            if [ -f "$M3_ZIP.sha256" ]; then want=$(cut -d' ' -f1 "$M3_ZIP.sha256"); have=$(sha256sum "$M3_ZIP" | cut -d' ' -f1); echo "zip sha256 $have (expected $want)" | tee -a "$RUNNER_TEMP/logs/package.log"; [ "$have" = "$want" ]; fi
            python -I -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); b=z.testzip(); print('entries', len(z.namelist()), 'crc', 'ok' if b is None else b); sys.exit(b is not None)" "$M3_ZIP" | tee -a "$RUNNER_TEMP/logs/package.log"
            python -I -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$M3_ZIP" work
          else
            echo "mode: Milestone 2 ZIP + m3-overlay (development run)" | tee "$RUNNER_TEMP/logs/package.log"
            git fetch --depth=1 origin milestone-2-0362
            git show "origin/milestone-2-0362:$M2_ZIP" > m2.zip
            have=$(sha256sum m2.zip | cut -d' ' -f1); echo "m2 zip sha256 $have (expected $M2_SHA256)" | tee -a "$RUNNER_TEMP/logs/package.log"; [ "$have" = "$M2_SHA256" ]
            python -I -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); b=z.testzip(); assert b is None, b; z.extractall(sys.argv[2]); print('m2 entries', len(z.namelist()))" m2.zip work | tee -a "$RUNNER_TEMP/logs/package.log"
            cp -a m3-overlay/EightMax-Test-Workbench/. work/EightMax-Test-Workbench/
            if [ -f m3-overlay/DELETED.txt ]; then while IFS= read -r f; do [ -n "$f" ] && rm -f "work/EightMax-Test-Workbench/$f"; done < m3-overlay/DELETED.txt; fi
            rm -f m2.zip
          fi
          cd work/EightMax-Test-Workbench
          python -I -c "import hashlib,pathlib,sys; r=pathlib.Path('.'); L=[l.split('  ',1) for l in pathlib.Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines() if l.strip()]; bad=[f for h,f in L if hashlib.sha256((r/f).read_bytes()).hexdigest()!=h]; files={p.as_posix() for p in r.rglob('*') if p.is_file()}-{'SHA256SUMS.txt'}; missing=sorted(files-{f for h,f in L}); print('manifest entries', len(L), 'mismatches', len(bad), 'unlisted', len(missing)); print(bad[:5], missing[:5]); sys.exit(1 if bad or missing else 0)" | tee -a "$RUNNER_TEMP/logs/package.log"
          echo "W=$(cygpath -w "$PWD")" >> "$GITHUB_ENV"
      - name: Parse every Windows PowerShell script (Windows PowerShell 5.1 parser)
        shell: powershell
        run: |
          $errs = @(); $n = 0; foreach ($f in Get-ChildItem "$env:W\windows","$env:W\native" -Filter *.ps1) { $n++; $t = $null; $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e); foreach ($x in $e) { $errs += ($f.Name + ':' + $x.Extent.StartLineNumber + ': ' + $x.Message) } }
          $errs | Out-File "$env:RUNNER_TEMP\logs\powershell-parse.log"; "parsed $n scripts; $($errs.Count) errors"
          if ($errs.Count) { $errs; throw 'PowerShell parse errors' }
      - name: Set the runner desktop to 1920x1080 (test environment only)
        shell: powershell
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class EmDisplay {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)] public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName; public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput; public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName; public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency, dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll")] static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) { DEVMODE dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE)); EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000; return ChangeDisplaySettings(ref dm, 0); }
          }
          "@
          $r = [EmDisplay]::Set(1920, 1080); Start-Sleep -Seconds 2; Add-Type -AssemblyName System.Windows.Forms
          "ChangeDisplaySettings returned $r; virtual screen now $([System.Windows.Forms.SystemInformation]::VirtualScreen)" | Tee-Object "$env:RUNNER_TEMP\logs\display.log"
      - name: "Milestone 3 phase: machine, executable identities, complete regression suite (bundled Node)"
        id: machine
        timeout-minutes: 60
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-machine-identity-unit.log"; $err = "$env:RUNNER_TEMP\logs\phase-machine-identity-unit.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases machine,identity,unit -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 phase: desktop host start - prebuilt, forced fallback compile, cache, invalid cache, shutdown"
        id: host_start
        timeout-minutes: 25
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-host-start.log"; $err = "$env:RUNNER_TEMP\logs\phase-host-start.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases host-start -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 phase: Milestone 2 lifecycle acceptance A-K with real windows, under the process-exit audit"
        id: lifecycle
        timeout-minutes: 45
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-lifecycle.log"; $err = "$env:RUNNER_TEMP\logs\phase-lifecycle.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases lifecycle -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 phase: Milestone 3 gameplay acceptance T1-T6 with real windows"
        id: gameplay
        timeout-minutes: 45
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-gameplay.log"; $err = "$env:RUNNER_TEMP\logs\phase-gameplay.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases gameplay -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 phase: multi-table stability 1, 2, 5 and 8 tables with real windows"
        id: multi_table
        timeout-minutes: 50
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-multi-table.log"; $err = "$env:RUNNER_TEMP\logs\phase-multi-table.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases multi-table -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 phase: long campaign (only when campaign_hands > 0)"
        id: campaign
        timeout-minutes: 60
        continue-on-error: true
        shell: powershell
        run: |
          Set-Location $env:W; $secs = '${{ github.event.inputs.stability_seconds }}'; if (-not $secs) { $secs = '60' }; $hands = '${{ github.event.inputs.campaign_hands }}'; if (-not $hands) { $hands = '0' }
          if (Test-Path "$env:GITHUB_WORKSPACE\ci-request.json") { $req = Get-Content "$env:GITHUB_WORKSPACE\ci-request.json" -Raw | ConvertFrom-Json; if ($req.stabilitySeconds) { $secs = [string]$req.stabilitySeconds }; if ($null -ne $req.campaignHands) { $hands = [string]$req.campaignHands } }
          $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-campaign.log"; $err = "$env:RUNNER_TEMP\logs\phase-campaign.err.log"
          # stdout / stderr go to files (a native stderr line must never abort this step before its output is shown)
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases campaign -FullSuite -StabilitySeconds ' + $secs + ' -CampaignHands ' + $hands) -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: "Milestone 3 results: cleanup check, merged results (JSON, TXT, ZIP) - decides the outcome"
        if: always()
        timeout-minutes: 10
        shell: powershell
        run: |
          Set-Location $env:W; $out = "$env:RUNNER_TEMP\m3-results"; $log = "$env:RUNNER_TEMP\logs\phase-results.log"; $err = "$env:RUNNER_TEMP\logs\phase-results.err.log"
          $p = Start-Process -FilePath powershell.exe -ArgumentList ('-NoProfile -ExecutionPolicy Bypass -File windows\Test-Milestone3-0362.ps1 -OutDir "' + $out + '" -Phases cleanup,results') -WorkingDirectory $env:W -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()   # the runner process only (-Wait would also wait for any process it left behind)
          $code = $p.ExitCode; Get-Content $log; if ((Get-Item $err).Length -gt 0) { '--- stderr ---'; Get-Content $err }
          "exit $code"; exit $code
      - name: Publish the results into the job log
        if: always()
        shell: powershell
        run: |
          $out = "$env:RUNNER_TEMP\m3-results"
          if (Test-Path "$out\milestone3-results.txt") { '===== milestone3-results.txt'; Get-Content "$out\milestone3-results.txt" } else { 'no milestone3-results.txt' }
          foreach ($f in @('milestone3-results.json', 'gameplay-acceptance.json', 'gameplay-stability.json', 'gameplay-campaign.json', 'lifecycle-acceptance.json', 'lifecycle-exit-audit.json')) { $p = Join-Path $out $f; if (Test-Path $p) { '===== ' + $f + ' (' + (Get-Item $p).Length + ' bytes, first 60000 characters)'; $t = Get-Content $p -Raw; if ($t.Length -gt 60000) { $t.Substring(0, 60000) } else { $t } } }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eightmax-0362-m3-windows-results
          path: |
            ${{ runner.temp }}\m3-results
            ${{ runner.temp }}\m3-results.zip
            ${{ runner.temp }}\logs
      - name: Push the results to branch m3-results/<run id>
        if: always()
        shell: bash
        run: |
          set -u
          res="$RUNNER_TEMP/m3-results"; dest="$RUNNER_TEMP/m3-results-branch"; mkdir -p "$dest/results" "$dest/logs"
          if [ -d "$res" ]; then (cd "$res" && find . -type f -size -8M -print0 | xargs -0 -I{} cp --parents {} "$dest/results/") ; fi
          cp -r "$RUNNER_TEMP/logs/." "$dest/logs/" 2>/dev/null || true
          printf '{"run":"%s","sha":"%s","ref":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" > "$dest/run.json"
          cd "$dest" && git init -q && git checkout -q -b "m3-results/$GITHUB_RUN_ID" && git add -A && git -c user.name="eightmax-ci" -c user.email="eightmax-ci@users.noreply.github.com" commit -q -m "Milestone 3 Windows results, run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/m3-results/$GITHUB_RUN_ID" && echo "results pushed to m3-results/$GITHUB_RUN_ID"
