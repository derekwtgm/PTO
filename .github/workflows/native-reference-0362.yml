name: Native EightMax 5.1 reference validation
on:
  push:
    branches: [native-reference-0362]
permissions:
  contents: read
  actions: read
jobs:
  reference:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@v4
        with:
          name: windows-0362-build-and-evidence
          run-id: 44987268114
          github-token: ${{ github.token }}
          path: downloaded
      - name: Restore compiled application and reviewed source repairs
        shell: pwsh
        run: |
          Expand-Archive downloaded/EightMax-0.36.2-Windows-Candidate.zip app
          Copy-Item reference-validation/* app/PTO/ -Recurse -Force
      - name: Check quality evidence binding and convergence routing
        timeout-minutes: 3
        shell: pwsh
        working-directory: app/PTO
        run: node --test tests/quality-031.test.cjs tests/library-routing-0361.test.cjs
      - name: Train and independently validate native river reference
        timeout-minutes: 6
        shell: pwsh
        working-directory: app/PTO
        run: node tools/native-reference-0362.cjs "$env:RUNNER_TEMP/native-reference"
      - name: Demonstrate a native decision through actual screen capture and input
        if: success() || failure()
        timeout-minutes: 14
        shell: pwsh
        working-directory: app/PTO
        run: node tools/native-screen-reference-0362.cjs --width 960 --layout stack --workloads reference:0 --out "$env:RUNNER_TEMP/native-reference/screen-reference.json" --work "$env:RUNNER_TEMP/native-reference/screen-work"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reference-0362
          path: ${{ runner.temp }}/native-reference
