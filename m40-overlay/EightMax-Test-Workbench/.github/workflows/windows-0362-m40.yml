          printf '{"run":"%s","sha":"%s","zipSha256":"%s","job":"%s","scaleRequested":%s,"outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.package.outputs.zip_sha256 }}" "$tag" "${{ matrix.scale }}" "${{ steps.run.outcome }}" > "$dest/run.json"
          cd "$dest" && git init -q && git config core.longpaths true && git checkout -q -b "m40-results/$GITHUB_RUN_ID-$tag" && git add -A && git -c user.name="eightmax-ci" -c user.email="eightmax-ci@users.noreply.github.com" commit -q -m "Milestone 4.0 $tag, run $GITHUB_RUN_ID ($GITHUB_SHA)"
          for i in 1 2 3 4; do git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/m40-results/$GITHUB_RUN_ID-$tag" && echo "pushed m40-results/$GITHUB_RUN_ID-$tag" && break; sleep $((i * 5)); done
      - name: Outcome
        if: always()
        shell: bash
        run: '[ "${{ steps.run.outcome }}" = "success" ]'

  motion:
    needs: [plan, package]
    if: always() && needs.package.result == 'success' && fromJSON(needs.plan.outputs.req).motion
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m40-release-zip
          path: zipdir
      - name: Extract the packaged ZIP (SHA-256 checked)
        shell: powershell
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE ('zipdir\' + $env:M40_ZIP); $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant(); if ($h -ne '${{ needs.package.outputs.zip_sha256 }}') { throw 'the ZIP differs from the packaged one' }
          $base = Join-Path $env:RUNNER_TEMP 'EightMax CI (motion)'; Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::ExtractToDirectory($zip, $base)
          [IO.File]::AppendAllText($env:GITHUB_ENV, ("APP=" + (Join-Path $base 'EightMax-Test-Workbench') + "`n"), (New-Object Text.UTF8Encoding($false)))
      - name: Desktop 1920x1080 at 100 %
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:APP 'tests\windows\M32-Display.ps1') -Width 1920 -Height 1080 -ScalePercent 100 -Out (Join-Path $env:RUNNER_TEMP 'display.json'); exit 0
      - name: Mouse motion at 400, 800, 1200, 2000 and 2800 px/s (independent cursor sampler; the table records every press)
        id: run
        continue-on-error: true
        timeout-minutes: 35
        shell: powershell
        run: |
          $o = Join-Path $env:RUNNER_TEMP 'm40-motion'; [IO.Directory]::CreateDirectory($o) | Out-Null; $node = Join-Path $env:APP 'runtime\node\node.exe'
          & $node (Join-Path $env:APP 'tools\motion-validation-040.cjs') --speeds 400,800,1200,2000,2800 --moves 12 --clicks 8 --out (Join-Path $o 'motion-validation.json') --oracle-dir (Join-Path $o 'oracle') 2>&1 | Tee-Object -FilePath (Join-Path $o 'motion-validation.log')
          exit $LASTEXITCODE
      - name: Push the results to branch m40-results/<run id>-motion
        if: always()
        shell: bash
        run: |
          set -u
          res="$RUNNER_TEMP/m40-motion"; dest="$RUNNER_TEMP/branch"; mkdir -p "$dest/results"
          if [ -d "$res" ]; then (cd "$res" && find . -type f -size -8M ! -name '*.zip' -print0 | xargs -0 -I{} cp --parents {} "$dest/results/"); fi
          cp "$RUNNER_TEMP/display.json" "$dest/" 2>/dev/null || true
          printf '{"run":"%s","sha":"%s","zipSha256":"%s","job":"motion","outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.package.outputs.zip_sha256 }}" "${{ steps.run.outcome }}" > "$dest/run.json"
          cd "$dest" && git init -q && git config core.longpaths true && git checkout -q -b "m40-results/$GITHUB_RUN_ID-motion" && git add -A && git -c user.name="eightmax-ci" -c user.email="eightmax-ci@users.noreply.github.com" commit -q -m "Milestone 4.0 motion validation, run $GITHUB_RUN_ID ($GITHUB_SHA)"
          for i in 1 2 3 4; do git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/m40-results/$GITHUB_RUN_ID-motion" && echo "pushed m40-results/$GITHUB_RUN_ID-motion" && break; sleep $((i * 5)); done
      - name: Outcome
        if: always()
        shell: bash
        run: '[ "${{ steps.run.outcome }}" = "success" ]'

  launcher:
    needs: [plan, package]
    if: always() && needs.package.result == 'success' && fromJSON(needs.plan.outputs.req).launcher
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m40-release-zip
          path: zipdir
      - name: Extract the packaged ZIP (SHA-256 checked) into a new folder (spaces, parentheses, non-ASCII)
        shell: powershell
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE ('zipdir\' + $env:M40_ZIP); $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant(); if ($h -ne '${{ needs.package.outputs.zip_sha256 }}') { throw 'the ZIP differs from the packaged one' }
          $base = Join-Path $env:RUNNER_TEMP ('EightMax CI (launcher) ' + [char]0x00e9); Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::ExtractToDirectory($zip, $base)
          [IO.File]::AppendAllText($env:GITHUB_ENV, ("APP=" + (Join-Path $base 'EightMax-Test-Workbench') + "`n"), (New-Object Text.UTF8Encoding($false)))
      - name: Desktop 1920x1080 at 125 % (the operator PC's scaling)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:APP 'tests\windows\M32-Display.ps1') -Width 1920 -Height 1080 -ScalePercent 125 -Out (Join-Path $env:RUNNER_TEMP 'display.json'); exit 0
      - name: "RUN-M4-PERFORMANCE-TEST.cmd A, B (short), E - non-interactive, the operator's launcher and Windows PowerShell 5.1"
        id: run
        continue-on-error: true
        timeout-minutes: 80
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'm40-launcher'; [IO.Directory]::CreateDirectory($out) | Out-Null; $env:EIGHTMAX_NONINTERACTIVE = '1'; $fail = 0
          foreach ($m in @(@{ k = 'A'; a = '-RecognitionFrames 3' }, @{ k = 'B'; a = '-ABSeconds 30 -ABTables 1,2,5' }, @{ k = 'E'; a = '' })) {
            $env:EIGHTMAX_M4_ARGS = $m.a; $log = Join-Path $out ('launcher-' + $m.k + '.log'); $err = Join-Path $out ('launcher-' + $m.k + '.err.log')
            $p = Start-Process -FilePath cmd.exe -ArgumentList ('/d /c ""' + (Join-Path $env:APP 'RUN-M4-PERFORMANCE-TEST.cmd') + '" ' + $m.k + ' "' + $out + '""') -WorkingDirectory $env:APP -RedirectStandardOutput $log -RedirectStandardError $err -NoNewWindow -PassThru; $null = $p.Handle; $p.WaitForExit()
            "===== mode $($m.k): exit $($p.ExitCode)"; Get-Content $log -Tail 25
            if ($m.k -ne 'E' -and $p.ExitCode -ne 0) { $fail++ }; if ($m.k -eq 'E' -and $p.ExitCode -ne 0 -and $p.ExitCode -ne 6) { $fail++ }
          }
          Get-ChildItem $out -Directory | ForEach-Object { $_.Name; $s = Join-Path $_.FullName 'M4-SUMMARY.txt'; if (Test-Path $s) { Get-Content $s } }
          exit $fail
      - name: Push the results to branch m40-results/<run id>-launcher
        if: always()
        shell: bash
        run: |
          set -u
          res="$RUNNER_TEMP/m40-launcher"; dest="$RUNNER_TEMP/branch"; mkdir -p "$dest/results"
          if [ -d "$res" ]; then (cd "$res" && find . -type f -size -8M ! -name 'oracle-*' -print0 | xargs -0 -I{} cp --parents {} "$dest/results/"); fi
          cp "$RUNNER_TEMP/display.json" "$dest/" 2>/dev/null || true
          printf '{"run":"%s","sha":"%s","zipSha256":"%s","job":"launcher","outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.package.outputs.zip_sha256 }}" "${{ steps.run.outcome }}" > "$dest/run.json"
          cd "$dest" && git init -q && git config core.longpaths true && git checkout -q -b "m40-results/$GITHUB_RUN_ID-launcher" && git add -A && git -c user.name="eightmax-ci" -c user.email="eightmax-ci@users.noreply.github.com" commit -q -m "Milestone 4.0 launcher, run $GITHUB_RUN_ID ($GITHUB_SHA)"
          for i in 1 2 3 4; do git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/m40-results/$GITHUB_RUN_ID-launcher" && echo "pushed m40-results/$GITHUB_RUN_ID-launcher" && break; sleep $((i * 5)); done
      - name: Outcome
        if: always()
        shell: bash
        run: '[ "${{ steps.run.outcome }}" = "success" ]'

